[package]
name = "coffer-cli"
version = "0.1.0"
edition = "2021"
authors = ["kula <kula@live.com>"]
license = "MIT"
rust-version = "1.78"
description = "Coffer CLI — command-line interface for MicroVM sandbox management"

[[bin]]
name = "coffer-cli"
path = "src/main.rs"

[dependencies]
coffer-core = { path = "../coffer-core" }
coffer-protocol = { path = "../coffer-protocol" }
tokio = { version = "1.43", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
